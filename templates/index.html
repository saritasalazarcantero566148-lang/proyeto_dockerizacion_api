<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestor de Tareas</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    background: #f4f4f4;
    color: #222;
  }
  h1 { text-align: center; }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type=text] {
    flex: 1;
    padding: 8px;
  }
  button {
    padding: 8px 14px;
    cursor: pointer;
  }
  ul { list-style: none; padding: 0; }
  li {
    background: white;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  li.completada span.titulo {
    text-decoration: line-through;
    color: #888;
  }
  .acciones button {
    margin-left: 6px;
  }
</style>
</head>
<body>

<h1>Gestor de Tareas</h1>

<form id="form-tarea">
  <input type="text" id="titulo" placeholder="Nueva tarea..." required>
  <button type="submit">Agregar</button>
</form>

<ul id="lista-tareas"></ul>

<script>
const API = "/api/tareas";

async function cargarTareas() {
  const res = await fetch(API);
  const tareas = await res.json();
  const lista = document.getElementById("lista-tareas");
  lista.innerHTML = "";

  tareas.forEach(tarea => {
    const li = document.createElement("li");
    if (tarea.completada) li.classList.add("completada");

    li.innerHTML = `
      <span class="titulo">${tarea.titulo}</span>
      <span class="acciones">
        <button onclick="marcarCompletada(${tarea.id}, ${!tarea.completada})">
          ${tarea.completada ? "Deshacer" : "Completar"}
        </button>
        <button onclick="eliminarTarea(${tarea.id})">Eliminar</button>
      </span>
    `;
    lista.appendChild(li);
  });
}

document.getElementById("form-tarea").addEventListener("submit", async (e) => {
  e.preventDefault();
  const titulo = document.getElementById("titulo").value;

  await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ titulo })
  });

  document.getElementById("titulo").value = "";
  cargarTareas();
});

async function marcarCompletada(id, nuevoEstado) {
  await fetch(`${API}/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ completada: nuevoEstado })
  });
  cargarTareas();
}

async function eliminarTarea(id) {
  await fetch(`${API}/${id}`, { method: "DELETE" });
  cargarTareas();
}

cargarTareas();
</script>

</body>
</html>
