<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Tareas</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;

    margin-bottom: 28px;

    margin: 0 0 8px;

    font-weight: 700;

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>Gestor de Tareas</h1>
    <p>Organiza tus actividades de forma sencilla.</p>
  </div>

  <div class="panel">

    <form id="form-tarea" class="formulario">
      <input
        type="text"
        id="titulo"
        placeholder="Escribe una nueva tarea..."
        required
      >
      <button type="submit" class="btn-agregar">
        Agregar tarea
      </button>
    </form>

    <div class="titulo-seccion">
      <h2>Mis tareas</h2>
    </div>

    <ul id="lista-tareas" class="lista"></ul>

  </div>

</div>

<script>
const API = "/api/tareas";

async function cargarTareas() {
  const res = await fetch(API);
  const tareas = await res.json();

  const lista = document.getElementById("lista-tareas");
  lista.innerHTML = "";

  if (tareas.length === 0) {
    lista.innerHTML = `
      <li class="vacio">
        No tienes tareas todavía.
      </li>
    `;
    return;
  }

  tareas.forEach(tarea => {
    const li = document.createElement("li");

    li.className = "tarea";

    if (tarea.completada) {
      li.classList.add("completada");
    }

    li.innerHTML = `
      <div class="informacion-tarea">
        <span class="titulo">${tarea.titulo}</span>
        <span class="estado">
          ${tarea.completada ? "Tarea completada" : "Pendiente"}
        </span>
      </div>

      <div class="acciones">

        <button onclick="marcarCompletada(${tarea.id}, ${!tarea.completada})">
          ${tarea.completada ? "Deshacer" : "Completar"}
        </button>

        <button
          class="eliminar"
          onclick="eliminarTarea(${tarea.id})">
          Eliminar
        </button>

      </div>
    `;

    lista.appendChild(li);
  });
}

document
  .getElementById("form-tarea")
  .addEventListener("submit", async (e) => {

    e.preventDefault();

    const titulo = document
      .getElementById("titulo")
      .value
      .trim();

    if (!titulo) return;

    await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        titulo: titulo
      })
    });

    document.getElementById("titulo").value = "";

    cargarTareas();
  });

async function marcarCompletada(id, nuevoEstado) {

  await fetch(`${API}/${id}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      completada: nuevoEstado
    })
  });

  cargarTareas();
}

async function eliminarTarea(id) {

  await fetch(`${API}/${id}`, {
    method: "DELETE"
  });

  cargarTareas();
}

cargarTareas();
</script>

</body>
</html>
